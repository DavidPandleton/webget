name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev deps (unit tests are pure logic, no runtime deps needed)
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff
      - name: Lint
        run: ruff check webget_cli.py tests
      - name: Test
        run: pytest

  smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package (pulls runtime deps from pyproject)
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Smoke test
        run: |
          webget --help | head -20
          python -c "import webget_cli; print('import ok')"
          webget s "test" --limit 3 | head -4
